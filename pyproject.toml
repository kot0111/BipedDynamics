[tool.poetry]
name = "Biped2PFramework"
version = "0.1.0"
description = "The implementation of a dynamics and control model for a bipedal robot with two passive links"
authors = ["kot0111 <kozyura0111@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^2.4.0"
scipy = "^1.16.3"
matplotlib = "^3.10.8"
sympy = "^1.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
